name: Cross-language conformance

# DELIBERATELY UNFILTERED. Every other workflow here is scoped to its own language's paths;
# this one runs on everything, because it is the only job that asserts the Python, TypeScript
# and Go clients agree on the wire.
#
# Path-filtering it would recreate exactly the hole this repo closed by bringing the Go client
# in: parity asserted by hand-mirrored literals in suites that ran separately -- and, until
# recently, in separate repositories, where nothing could run both sides. Five cross-language
# claims went silently false in a single afternoon under that arrangement.
#
# So: a change to any language, or to the shared fixture, runs all three suites.
on:
  push:
  pull_request:

# Read-only. This job runs unpinned dependency code (poetry/pnpm/go installs), so the
# default repository token -- which may include contents: write -- is more than it needs.
permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        # Through env rather than interpolated into the script -- see go-release.yaml.
        env:
          POETRY_VERSION: ${{ vars.POETRY_V2_VERSION }}
        run: |
          pipx install "poetry==$POETRY_VERSION"
          pipx install invoke
          poetry install --with dev,test --no-root
          pnpm install --frozen-lockfile

      # The Go↔Python suite builds gcachectl itself and drives it against the redislite
      # instance the Python fixtures start, so it needs the Go toolchain present. It SKIPS if
      # go is missing, which is right for a contributor and wrong here -- hence the guard.
      - name: Fail if the Go toolchain is missing
        run: |
          command -v go >/dev/null || {
            echo "::error::go not on PATH; the cross-language suite would silently skip"
            exit 1
          }

      - name: All three conformance suites
        run: inv test-conformance

      # The property that makes the fixture worth having: a changed vector must fail EVERY
      # suite. If only some fail, the ones that passed are not really reading the file.
      # Asserted here rather than trusted, because it is the one check that cannot be
      # verified by reading the suites.
      #
      # Three things this step learned the hard way, all of which made it report a FALSE
      # cause before they were fixed:
      #
      #   1. `go test` CACHES. The step above runs the same suite against the UNMUTATED
      #      fixture, so a bare `go test` here returns `ok (cached)` and Go looks like the
      #      client that is not reading the file. Hence -count=1. This is not hypothetical:
      #      it is what the first run of this workflow actually reported.
      #   2. A mutation that silently no-ops (vector renamed, key renamed) makes all three
      #      suites pass and the step blames the suites. So the mutation asserts it landed.
      #   3. Discarding each suite's output means knowing only the COUNT that failed, not
      #      WHICH -- and the count alone cannot distinguish "TS is not reading the file"
      #      from "TS was cached". So each suite's outcome is named.
      - name: Prove the fixture binds all three clients
        run: |
          set -e
          F=src/gcache/conformance/envelope_vectors.json
          cp "$F" /tmp/vectors.bak
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("src/gcache/conformance/envelope_vectors.json")
          d = json.loads(p.read_text())
          hits = 0
          for v in d["vectors"]:
              if v["name"] == "fractional-expires":
                  assert v["expect"] == "reject", f'expected reject, found {v["expect"]!r}'
                  v["expect"] = "accept"
                  v["decoded"] = {"createdAtMs": 1757308800123, "expiresAtMs": 1757308860123,
                                  "payload": "{\"a\":1}"}
                  hits += 1
          if hits != 1:
              sys.exit(f"mutation matched {hits} vectors, expected 1 -- "
                       "the 'fractional-expires' vector was renamed or removed, so this "
                       "step would have proven nothing")
          p.write_text(json.dumps(d, indent=2))
          PY
          fails=0
          detected=""
          missed=""
          unrelated=""
          MUTATED_VECTOR=fractional-expires
          # A non-zero exit is NOT proof the client read the mutated vector. A collection
          # error, a missing dependency or an unrelated assertion all exit non-zero too, and
          # counting those as detection is the same false green this step exists to rule
          # out -- one level further in. So the outcome is three-way, and only the middle
          # case counts:
          #
          #   exit 0                          -> MISSED: the client did not read the vector
          #   non-zero AND names the vector   -> DETECTED
          #   non-zero and does NOT name it   -> UNRELATED failure, fails the step outright
          #
          # All three suites name the failing vector in their output, verified by running
          # each against this exact mutation.
          run_suite() {
            name="$1"; shift
            if "$@" >"/tmp/$name.log" 2>&1; then
              missed="$missed $name"
              echo "::group::$name PASSED on a mutated fixture (tail)"
              tail -40 "/tmp/$name.log"
              echo "::endgroup::"
              return
            fi
            if grep -q "$MUTATED_VECTOR" "/tmp/$name.log"; then
              detected="$detected $name"
              fails=$((fails+1))
              return
            fi
            echo "::group::$name failed WITHOUT naming $MUTATED_VECTOR (tail)"
            tail -60 "/tmp/$name.log"
            echo "::endgroup::"
            echo "::error::$name failed for an unrelated reason, so this step cannot tell"
            echo "::error::whether it reads the shared fixture. Fix that failure first."
            unrelated="$unrelated $name"
          }
          run_suite python poetry run pytest tests/test_conformance.py -q
          # The conformance FILE, not the whole vitest suite: a flake elsewhere among the 97
          # tests would otherwise reach the classifier at all.
          run_suite typescript pnpm --filter @rungalileo/gcache exec vitest run test/gcache-conformance.test.ts
          run_suite go go -C go test -count=1 -run TestConformance ./...
          cp /tmp/vectors.bak "$F"
          if [ -n "$unrelated" ]; then
            echo "::error::unrelated failures in:$unrelated"
            exit 1
          fi
          echo "detected the mutation:$detected"
          if [ "$fails" -ne 3 ]; then
            echo "::error::mutated vector detected by$detected but NOT by$missed -- \
          that client is not reading the shared fixture, or its result was cached"
            exit 1
          fi
          echo "all three suites detected the mutated vector"

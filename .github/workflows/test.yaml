name: test

# Path-filtered: with three implementations a Go-only change should not pay for a Python
# run. The cross-language gate is deliberately unfiltered -- see conformance.yaml.
#
# NOTE: on `pull_request` the filter is evaluated over the PR's CUMULATIVE diff, not the
# latest commit -- see the longer note in go.yaml.
#
# pull_request added alongside the filter. This workflow previously triggered on `push`
# only, so the Python suite never ran on a PR from a fork; scoping a trigger that barely
# fires would have been worse than not scoping it.
on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      # tests/test_metrics_docs.py asserts the README's metric table matches metrics.py, so
      # a README-only edit must run this suite -- otherwise the test guarding the README is
      # the one thing a README change cannot trigger.
      - "README.md"
      - ".github/workflows/test.yaml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "poetry.lock"
      - "README.md"
      - ".github/workflows/test.yaml"

jobs:
  test:
    # Self-hosted for same-repo refs, GitHub-hosted for forks.
    #
    # This is the only workflow here on the self-hosted `galileo` runner; everything else is
    # ubuntu-latest. Adding the `pull_request` trigger above therefore routed FORK-controlled
    # code onto persistent infrastructure, where it checks out and executes the PR's own
    # install/type-check/test steps. Fork token and secret restrictions do not help with
    # that: the risk is runner state and whatever the runner can reach, not the token.
    #
    # Forks run on ubuntu-latest instead of being skipped, so a fork PR keeps full Python
    # coverage. That is known to work rather than hoped: conformance.yaml already installs
    # this project and runs pytest on ubuntu-latest on every PR.
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
           && github.event.pull_request.head.repo.full_name != github.repository)
          && 'ubuntu-latest' || 'galileo' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install poetry
        run: pipx install poetry==${{vars.POETRY_V2_VERSION}}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "poetry"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          pipx install invoke
          inv install

      # We run the `mypy` check here since it requires all of the packages to be installed.
      # Doing that in the pre-commit step would be duplicative and spend more time in CI.
      - name: Validate Types
        run: inv type-check

      - name: Run Tets
        run: inv test

      # Dependabot-triggered runs cannot access repository secrets, so this
      # upload would fail with an empty Codecov token.
      - name: Upload Test Coverage Reports
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

version: 2
updates:
  # Update Python packages weekly.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"

  # Update GitHub Actions monthly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # The Go client. npm is deliberately absent for gcache-ts, which is unpublished; the Go
  # module IS consumed by a downstream service, so its dependencies are worth tracking.
  - package-ecosystem: "gomod"
    directory: "/go"
    schedule:
      interval: "monthly"

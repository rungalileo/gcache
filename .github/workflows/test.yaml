name: test

# DELIBERATELY UNFILTERED: `test` is a REQUIRED check, and a filtered workflow leaves its
# check Pending rather than Success -- so a PR touching only go/** could never merge.
# Keep it unfiltered unless the ruleset changes; the suite is ~15s.

on:
  push:
  pull_request:

# Without this, `push` and `pull_request` both fire for every push to a PR branch, so this
# job -- the only one on the self-hosted `galileo` runner -- runs twice and a later push
# cancels neither. Keyed on the ref, so a PR's own pushes supersede each other.
concurrency:
  group: test-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Read-only. This job installs and runs unpinned dependency code (pipx, poetry, the test
# suite) on a persistent runner, so the default token is more than it needs.
permissions:
  contents: read

jobs:
  test:
    # Self-hosted for same-repo refs, GitHub-hosted for forks.
    #
    # This is the only workflow here on the self-hosted `galileo` runner; everything else is
    # ubuntu-latest. Adding the `pull_request` trigger above therefore routed FORK-controlled
    # code onto persistent infrastructure, where it checks out and executes the PR's own
    # install/type-check/test steps. Fork token and secret restrictions do not help with
    # that: the risk is runner state and whatever the runner can reach, not the token.
    #
    # Forks run on ubuntu-latest instead of being skipped, so a fork PR keeps full Python
    # coverage. That is known to work rather than hoped: conformance.yaml already installs
    # this project and runs pytest on ubuntu-latest on every PR.
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
           && github.event.pull_request.head.repo.full_name != github.repository)
          && 'ubuntu-latest' || 'galileo' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The default leaves the token in .git/config as an http.extraheader for the whole
          # job, and the steps below run third-party code on a persistent runner.
          persist-credentials: false

      - name: Install poetry
        # Through env, not interpolated into the script: a repository variable carrying a
        # newline or $(...) would otherwise run as shell here. Same fix as conformance.yaml.
        env:
          POETRY_VERSION: ${{ vars.POETRY_V2_VERSION }}
        run: pipx install "poetry==$POETRY_VERSION"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "poetry"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          pipx install invoke
          inv install

      # We run the `mypy` check here since it requires all of the packages to be installed.
      # Doing that in the pre-commit step would be duplicative and spend more time in CI.
      - name: Validate Types
        run: inv type-check

      - name: Run Tets
        run: inv test

      # Skipped wherever the Codecov token is unavailable, because fail_ci_if_error is
      # true and an empty token turns the check red AFTER a green suite.
      #
      # Two such cases, not one. Dependabot runs cannot read repository secrets -- already
      # handled. Neither can a pull_request from a FORK, and that trigger was added to this
      # workflow alongside the path filter, so an outside contributor would see the tests
      # pass and the check fail. Guarding the actor alone missed it.
      - name: Upload Test Coverage Reports
        if: >-
          ${{ github.actor != 'dependabot[bot]'
              && (github.event_name != 'pull_request'
                  || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

name: typescript

# Path-filtered: with three implementations a Go- or Python-only change should not pay for
# a TypeScript run. The cross-language gate is deliberately unfiltered -- conformance.yaml.
on:
  push:
    paths:
      - "packages/gcache-ts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/typescript.yaml"
  pull_request:
    paths:
      - "packages/gcache-ts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/typescript.yaml"

jobs:
  gcache-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm ts:gcache:typecheck
      - run: pnpm ts:gcache:test
      # Dependabot-triggered runs cannot access repository secrets, so this
      # upload would fail with an empty Codecov token.
      - name: Upload TypeScript Coverage Reports
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/gcache-ts/coverage/lcov.info
          flags: gcache-ts
          name: gcache-ts
          fail_ci_if_error: true
          verbose: true
      - run: pnpm ts:gcache:build

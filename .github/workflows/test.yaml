name: test

# DELIBERATELY UNFILTERED, unlike go.yaml and typescript.yaml.
#
# `test` is a REQUIRED status check in the "Main branch rules" ruleset (alongside
# `pre-commit` and `Validate PR title`). A path-filtered workflow does not report its check
# as Success -- it leaves it Pending -- so filtering a required check means a pull request
# that touches none of the filtered paths can never become mergeable. A PR touching only
# go/** is exactly that case: on `pull_request` the filter is evaluated over the PR's
# cumulative diff, which for such a PR is go/** alone.
#
# This workflow WAS filtered for one commit. Keep it unfiltered unless the ruleset changes;
# the Python suite is ~15s, so there is little to save and a merge deadlock to lose.
# go.yaml and typescript.yaml stay filtered because neither is required, and conformance.yaml
# is unfiltered, so every PR still exercises all three clients.

on:
  push:
  pull_request:

jobs:
  test:
    # Self-hosted for same-repo refs, GitHub-hosted for forks.
    #
    # This is the only workflow here on the self-hosted `galileo` runner; everything else is
    # ubuntu-latest. Adding the `pull_request` trigger above therefore routed FORK-controlled
    # code onto persistent infrastructure, where it checks out and executes the PR's own
    # install/type-check/test steps. Fork token and secret restrictions do not help with
    # that: the risk is runner state and whatever the runner can reach, not the token.
    #
    # Forks run on ubuntu-latest instead of being skipped, so a fork PR keeps full Python
    # coverage. That is known to work rather than hoped: conformance.yaml already installs
    # this project and runs pytest on ubuntu-latest on every PR.
    runs-on: >-
      ${{ (github.event_name == 'pull_request'
           && github.event.pull_request.head.repo.full_name != github.repository)
          && 'ubuntu-latest' || 'galileo' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install poetry
        run: pipx install poetry==${{vars.POETRY_V2_VERSION}}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: "poetry"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          pipx install invoke
          inv install

      # We run the `mypy` check here since it requires all of the packages to be installed.
      # Doing that in the pre-commit step would be duplicative and spend more time in CI.
      - name: Validate Types
        run: inv type-check

      - name: Run Tets
        run: inv test

      # Skipped wherever the Codecov token is unavailable, because fail_ci_if_error is
      # true and an empty token turns the check red AFTER a green suite.
      #
      # Two such cases, not one. Dependabot runs cannot read repository secrets -- already
      # handled. Neither can a pull_request from a FORK, and that trigger was added to this
      # workflow alongside the path filter, so an outside contributor would see the tests
      # pass and the check fail. Guarding the actor alone missed it.
      - name: Upload Test Coverage Reports
        if: >-
          ${{ github.actor != 'dependabot[bot]'
              && (github.event_name != 'pull_request'
                  || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true
          verbose: true

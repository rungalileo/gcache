name: Full formal verification

on:
  workflow_dispatch:
    inputs:
      exploration:
        description: Explore a fresh seed in both ports in addition to pinned acceptance.
        type: boolean
        default: false
  schedule:
    - cron: "11 5 * * 1"

permissions:
  contents: read

concurrency:
  group: formal-full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exploration:
    if: (github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.exploration)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          quint: "true"
          go: "true"
      - name: Explore a fresh recorded seed and replay both ports
        run: make explore
      - name: Preserve exploratory sources, seed and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-exploration
          path: .formal-traces/exploration/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The single producer: model checks, corpus generation, fixture recomputation
  # and the shared witness evidence. Both port replays and both mutation
  # measurements depend only on this job's artifact and run in parallel.
  generate:
    # Scheduled workflows run the default branch; keep the intended main scope explicit.
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Run 34660598461 spent 8.5 minutes on model checks, 2.5 on generation,
    # 1 on fixtures and under a minute on witness evaluation.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          quint: "true"
      - name: Check models, regenerate artifacts and evaluate shared witness evidence
        run: make formal-generate
      - name: Preserve formal corpus, witness evidence and counterexamples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-traces
          path: .formal-traces/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  typescript-parity:
    needs: generate
    runs-on: ubuntu-latest
    # Run 34660598461 replayed the TypeScript corpus in 32 seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-traces
          path: .formal-traces
      - name: Require TypeScript replay of the complete corpus
        run: make formal-ts
      # Small companion to the full corpus so the aggregate can retain the
      # TypeScript completion without downloading every generated history.
      - name: Preserve TypeScript completion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-completion-evidence
          path: |
            .formal-traces/ts-completion.json
            .formal-traces/ts-context.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  symbolic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          quint: "true"
          java: "true"
      - name: Verify finite symbolic properties using approved solver bytes
        run: make model-check
      - name: Preserve symbolic verification results and solver identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-symbolic
          path: .formal-traces/symbolic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  typescript-mutations:
    needs: generate
    runs-on: ubuntu-latest
    # Run 34660598461 took 17 minutes; leave headroom for corpus growth.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-traces
          path: .formal-traces
      - name: Require TypeScript assertion-based fault detection
        run: make mutations-ts
      - name: Preserve TypeScript mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: typescript-semantic-evidence
          path: .formal-traces/semantic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  go-parity:
    needs: generate
    runs-on: ubuntu-latest
    # Run 34660598461 replayed the Go corpus with race detection in 4.5 minutes.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          go: "true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-traces
          path: .formal-traces
      - name: Require Go replay of the complete corpus with race detection
        run: make formal-go
      - name: Preserve Go parity completion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-parity-evidence
          path: |
            .formal-traces/go-replay.jsonl
            .formal-traces/go-replay-summary.json
            .formal-traces/go-context.json
            .formal-traces/go-completion.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  go-mutations:
    needs: generate
    runs-on: ubuntu-latest
    # Run 34660598461 took 23 minutes; leave headroom for corpus growth.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-validation
        with:
          go: "true"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-traces
          path: .formal-traces
      - name: Require Go assertion-based fault detection
        run: make mutations-go
      - name: Preserve Go mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-semantic-evidence
          path: .formal-traces/go-semantic/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # A failed or skipped dependency cannot turn smoke evidence into full acceptance.
  formal-full:
    needs: [generate, typescript-parity, symbolic, typescript-mutations, go-parity, go-mutations, exploration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Long-retention summary: completion/context reports and the symbolic and
      # exploration reports, without the multi-hundred-megabyte trace corpus.
      # Each download tolerates a missing artifact from a job that failed early.
      - name: Collect TypeScript completion evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: typescript-completion-evidence
          path: formal-summary/typescript
      - name: Collect Go completion evidence
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: go-parity-evidence
          path: formal-summary/go
      - name: Collect symbolic verification report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-symbolic
          path: formal-summary/symbolic
      - name: Collect exploration report
        if: always() && (github.event_name == 'schedule' || inputs.exploration == true)
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: formal-exploration
          path: formal-summary/exploration
      - name: Preserve the long-retention summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: formal-summary
          path: |
            formal-summary/typescript/ts-completion.json
            formal-summary/typescript/ts-context.json
            formal-summary/go/go-completion.json
            formal-summary/go/go-context.json
            formal-summary/go/go-replay-summary.json
            formal-summary/symbolic/report.json
            formal-summary/exploration/*/report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Require the generated corpus, both port replays and both mutation measurements
        env:
          GENERATE_RESULT: ${{ needs.generate.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript-parity.result }}
          TYPESCRIPT_MUTATIONS_RESULT: ${{ needs.typescript-mutations.result }}
          GO_RESULT: ${{ needs.go-parity.result }}
          GO_MUTATIONS_RESULT: ${{ needs.go-mutations.result }}
          SYMBOLIC_RESULT: ${{ needs.symbolic.result }}
          EXPLORATION_RESULT: ${{ needs.exploration.result }}
          EXPLORATION_REQUIRED: ${{ github.event_name == 'schedule' || inputs.exploration == true }}
        run: |
          test "$GENERATE_RESULT" = success
          test "$TYPESCRIPT_RESULT" = success
          test "$TYPESCRIPT_MUTATIONS_RESULT" = success
          test "$GO_RESULT" = success
          test "$GO_MUTATIONS_RESULT" = success
          test "$SYMBOLIC_RESULT" = success
          if [ "$EXPLORATION_REQUIRED" = true ]; then
            test "$EXPLORATION_RESULT" = success
          else
            test "$EXPLORATION_RESULT" = skipped
          fi
